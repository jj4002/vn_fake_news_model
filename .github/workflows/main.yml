name: 🚀 Build & Deploy Docker

# Chạy khi push/pull request vào main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest  # Server GitHub cung cấp miễn phí
    
    steps:
    # B1: Clone code repo về
    - name: 📥 Checkout
      uses: actions/checkout@v4
      
    # B2: Login Docker Hub (dùng secrets)
    - name: 🔐 Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      
    # B3: Build image + Push Docker Hub
    - name: 🏗️ Build & Push
      uses: docker/build-push-action@v6
      with:
        context: ./backend  # Thư mục chứa Dockerfile
        push: ${{ github.event_name != 'pull_request' }}  # Chỉ push khi merge main
        tags: |
          jamus0702/vn_fake_news_model:latest
          jamus0702/vn_fake_news_model:${{ github.sha }}
        cache-from: type=gha  # Cache build nhanh hơn
        cache-to: type=gha,mode=max
